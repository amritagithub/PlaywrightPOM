image: mcr.microsoft.com/playwright:v1.44.0-jammy

stages:
  - test

variables:
  NODE_ENV: test

cache:
  paths:
    - node_modules/

before_script:
  - npm ci

playwright-tests:
  stage: test
  script:
    - npx playwright install --with-deps
    - npx playwright test tests/UIBasictest.spec.js
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 1 week